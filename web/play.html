<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>和模型下棋</title>
<style>
  :root { --bg:#0f1216; --panel:#171c22; --line:#2a323c; --txt:#e6edf3; --dim:#8b98a5;
          --red:#e5534b; --green:#3fb950; --blue:#58a6ff; --gold:#d29922; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { padding:14px 22px; border-bottom:1px solid var(--line); display:flex; gap:14px;
           align-items:center; flex-wrap:wrap; }
  h1 { font-size:16px; margin:0; font-weight:600; }
  a { color:var(--blue); text-decoration:none; font-size:13px; }
  main { display:flex; gap:24px; padding:20px 22px; flex-wrap:wrap; align-items:flex-start; }
  .board { display:grid; grid-template-columns:repeat(9,52px); grid-template-rows:repeat(10,52px);
           background:#e8d3a9; border-radius:6px; padding:5px; box-shadow:0 8px 24px #0007; }
  .cell { position:relative; display:flex; align-items:center; justify-content:center;
          font-size:30px; user-select:none; cursor:pointer; }
  .cell::before { content:""; position:absolute; inset:0; border:1px solid #bd9f6e; }
  .cell.red { color:#b3261e; } .cell.black { color:#1f2937; }
  .cell.sel { background:#ffe9a8; }
  .cell.target::after { content:""; position:absolute; width:12px; height:12px;
      border-radius:50%; background:#2f7d32cc; }
  .cell.last { background:#f4df95; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px;
           padding:14px 16px; min-width:300px; max-width:360px; }
  .panel h2 { font-size:13px; color:var(--dim); margin:0 0 8px; font-weight:600; }
  .bar { height:10px; background:#39424e; border-radius:5px; overflow:hidden; margin:4px 0; }
  .bar > i { display:block; height:100%; }
  button, select { background:#20262e; color:var(--txt); border:1px solid var(--line);
                   border-radius:6px; padding:6px 12px; font-size:13px; cursor:pointer; }
  button:hover { border-color:#4b5563; }
  .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .dim { color:var(--dim); font-size:12px; }
  .kv { display:flex; justify-content:space-between; font-size:12px; color:var(--dim); }
  .kv b { color:var(--txt); font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; }
</style>
</head>
<body>
<header>
  <h1>和模型下棋</h1>
  <a href="/">← 回训练看板</a>
  <span class="dim" id="model-name"></span>
</header>
<main>
  <div>
    <div id="board" class="board"></div>
    <div class="row">
      <button id="btn-new">重新开局</button>
      <button id="btn-undo">悔棋</button>
      <button id="btn-hint">让引擎支招</button>
      <select id="sims">
        <option value="100">引擎思考 100</option>
        <option value="300" selected>引擎思考 300</option>
        <option value="800">引擎思考 800（慢）</option>
      </select>
    </div>
    <div class="dim" id="status" style="margin-top:10px">你执红先行，点棋子再点目标格。</div>
  </div>

  <div class="panel">
    <h2>引擎的评估</h2>
    <div class="kv"><span>局面价值（红方视角）</span><b id="val">-</b></div>
    <div class="bar"><i id="valbar" style="width:50%;background:#8b949e"></i></div>
    <div class="dim" style="margin-top:2px">右倾=红优，左倾=黑优（-1…+1）</div>

    <h2 style="margin-top:16px">它刚才在考虑什么</h2>
    <div id="visits" class="dim">还没有走棋</div>

    <h2 style="margin-top:16px">说明</h2>
    <div class="dim">
      概率条是 MCTS 里每个候选着法被访问的比例（搜索“投的票”）。<br>
      价值条是网络对当前局面的判断，和实际胜负对照就能看出它准不准。<br>
      想换模型：在看板页切换 checkpoint，或直接改 <code>runs/main/best.npz</code>。
    </div>
  </div>
</main>

<script>
const CH  = {R:'车',N:'马',B:'相',A:'仕',K:'帅',C:'炮',P:'兵'};
const CHB = {R:'车',N:'马',B:'象',A:'士',K:'将',C:'炮',P:'卒'};
let state = null, sel = null, busy = false;

function fenToSquares(fen) {
  const rows = fen.split(' ')[0].split('/');
  const sq = new Array(90).fill(null);
  rows.forEach((row,i) => {
    const y = 9-i; let x = 0;
    for (const ch of row) {
      if (/\d/.test(ch)) { x += +ch; continue; }
      sq[y*9+x] = {t: ch.toUpperCase(), red: ch === ch.toUpperCase()};
      x++;
    }
  });
  return sq;
}

function render() {
  if (!state) return;
  const sq = fenToSquares(state.fen);
  const el = document.getElementById('board');
  el.innerHTML = '';
  const targets = new Set();
  if (sel !== null) for (const [f,t] of state.legal) if (f === sel) targets.add(t);
  for (let y=9; y>=0; y--) for (let x=0; x<9; x++) {
    const i = y*9+x, p = sq[i];
    const d = document.createElement('div');
    d.className = 'cell';
    if (p) { d.textContent = (p.red?CH:CHB)[p.t]; d.classList.add(p.red?'red':'black'); }
    if (sel === i) d.classList.add('sel');
    if (targets.has(i)) d.classList.add('target');
    if (state.last && (state.last[0]===i || state.last[1]===i)) d.classList.add('last');
    d.onclick = () => click(i);
    el.appendChild(d);
  }
  const v = state.engine_value;
  if (v !== undefined && v !== null) {
    document.getElementById('val').textContent = (v>0?'+':'') + v.toFixed(2);
    const pct = (v*0.5+0.5)*100;
    const bar = document.getElementById('valbar');
    bar.style.width = pct+'%';
    bar.style.background = v > 0.05 ? '#e5534b' : v < -0.05 ? '#58a6ff' : '#8b949e';
  }
  const vs = state.engine_visits;
  if (vs && vs.length) {
    document.getElementById('visits').innerHTML = vs.map(([f,t,p]) =>
      `<div class="kv"><span>${f}→${t}</span><b>${(p*100).toFixed(0)}%</b></div>
       <div class="bar"><i style="width:${Math.max(2,p*100)}%;background:#3fb950"></i></div>`).join('');
  }
  if (state.over) {
    document.getElementById('status').textContent =
      state.winner === 'red' ? '红胜（你赢了）' : '黑胜（引擎赢了）';
  }
}

function click(i) {
  if (busy || !state || state.over) return;
  if (state.side !== 'red') return;
  const sq = fenToSquares(state.fen);
  if (sel === null) {
    if (sq[i] && sq[i].red) { sel = i; render(); }
    return;
  }
  if (i === sel) { sel = null; render(); return; }
  const legal = state.legal.some(([f,t]) => f===sel && t===i);
  if (!legal) {
    if (sq[i] && sq[i].red) { sel = i; render(); }
    return;
  }
  play(sel, i);
}

async function play(frm, to) {
  busy = true;
  document.getElementById('status').textContent = '引擎思考中…';
  const sims = +document.getElementById('sims').value;
  const r = await fetch('/api/play', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({frm, to, sims})}).then(r=>r.json());
  if (r.error) { document.getElementById('status').textContent = '这步不能走：'+r.error; busy=false; return; }
  state = r; sel = null; render();
  if (!state.over) document.getElementById('status').textContent =
    `轮到你了（第 ${Math.floor(state.move_count/2)+1} 回合）`;
  busy = false;
}

async function newGame() {
  state = await fetch('/api/new', {method:'POST'}).then(r=>r.json());
  sel = null; render();
  document.getElementById('status').textContent = '你执红先行，点棋子再点目标格。';
}

document.getElementById('btn-new').onclick = newGame;
document.getElementById('btn-undo').onclick = async () => {
  state = await fetch('/api/undo', {method:'POST'}).then(r=>r.json());
  sel = null; render();
};
document.getElementById('btn-hint').onclick = async () => {
  const r = await fetch('/api/hint', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({sims: 600})}).then(r=>r.json());
  document.getElementById('visits').innerHTML = r.visits.map(([f,t,p]) =>
    `<div class="kv"><span>${f}→${t}</span><b>${(p*100).toFixed(0)}%</b></div>
     <div class="bar"><i style="width:${Math.max(2,p*100)}%;background:#d29922"></i></div>`).join('');
};

fetch('/api/board').then(r=>r.json()).then(s => { state = s; render(); });
</script>
</body>
</html>
